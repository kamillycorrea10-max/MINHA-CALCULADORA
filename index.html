
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Minha Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Minha Calculadora</h1>

    <input type="number" id="num1" placeholder="Primeiro número">
    <input type="number" id="num2" placeholder="Segundo número">

    <br><br>

    <button onclick="calcular('+')">Somar (+)</button>
    <button onclick="calcular('/')">Dividir (÷)</button>

    <h2 id="resultado">Resultado: </h2>

    <script src="script.js"></script>
</body>
</html>
